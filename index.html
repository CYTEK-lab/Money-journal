<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>My Money Journal</title>
<style>
:root{--bg:#effaf4;--card:#fff;--ink:#0f2a24;--mut:#5f7d74;--line:#d5eadf;--pri:#10b981;--hd1:#0f766e;--hd2:#10b981;--need:#f97316;--want:#8b5cf6;--sav:#10b981;--hab:#0ea5e9;--bad:#e11d48;--gold:#f5b301}
@media(prefers-color-scheme:dark){:root{--bg:#09201b;--card:#10332b;--ink:#e8fff6;--mut:#8fb8aa;--line:#1d4a3f;--need:#fb923c;--want:#a78bfa;--sav:#34d399;--hab:#38bdf8;--bad:#fb7185}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:70px}
.hd{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 54px;border-radius:0 0 26px 26px}
.w{max-width:620px;margin:0 auto}.hd .w{padding:0}.main{max-width:620px;margin:-40px auto 0;padding:0 14px}
.mo{display:flex;align-items:center;justify-content:space-between}.mo b{font-size:20px}
.mo button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(15,118,110,.10)}
h2{font-size:17px;margin:0}.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.t{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.wr{flex-wrap:wrap}
.big{font-size:34px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:5px 0 2px}.bar i{display:block;height:100%;border-radius:6px}
button{font:inherit;border:0;border-radius:12px;padding:8px 14px;background:var(--line);color:var(--ink)}
button.p{background:var(--pri);color:#fff;font-weight:600}button.on{background:var(--hd1);color:#fff}
input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:5px 2px;min-width:0}input:focus{outline:0;border-color:var(--pri)}
.it{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.it .nm{flex:1}.it .am{width:90px;text-align:right}.it input[type=checkbox],.al input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.done .nm{text-decoration:line-through;color:var(--mut)}.x{background:none;color:var(--mut);padding:2px 6px}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:2px 10px;color:#fff}
.al{display:flex;align-items:center;gap:8px;padding:5px 0}.al span{flex:1}
.over{color:var(--bad)}.quote{text-align:center;font-style:italic;color:var(--mut);margin:18px 6px}
#lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--hd1),#064e3b);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;color:#fff;text-align:center}
#lock input{width:100%;text-align:center;font-size:26px;letter-spacing:.4em;color:#fff;border-bottom:2px solid rgba(255,255,255,.6);margin:14px 0}
#lock button{width:100%;margin-top:8px;padding:12px}#lock .p{background:var(--gold);color:#222}#lock .g{background:rgba(255,255,255,.18);color:#fff}
.hide{display:none!important}
</style></head><body>
<div id="lock"><div style="width:100%;max-width:320px"><div style="font-size:46px">🌱</div><h2 id="lt" style="font-size:22px"></h2><div id="ls" class="t" style="color:#bff0dc"></div>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"><input id="pin2" class="hide" type="password" inputmode="numeric" placeholder="confirm">
<div id="le" style="color:#fecdd3;min-height:20px"></div><button class="p" id="go">Unlock</button><button class="g hide" id="fp">👆 Use fingerprint</button></div></div>
<div id="app" class="hide"></div>
<script>
const L=localStorage,te=new TextEncoder(),td=new TextDecoder(),$=s=>document.getElementById(s);
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let K=null,S=null,cur=null,tm=null;
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');cur=ym(new Date());
const rid=()=>Math.random().toString(36).slice(2,8),fmt=n=>(Math.round(n)||0).toLocaleString();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
async function derive(pin,salt){const m=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,te.encode(JSON.stringify(o))))}
async function dec(s){const [i,c]=s.split('.');return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},K,ub(c))))}
/* ---------- lock ---------- */
function showLock(){K=null;S=null;$('app').classList.add('hide');$('lock').classList.remove('hide');$('pin').value=$('pin2').value='';$('le').textContent='';
 const setup=!L.mj_salt;$('lt').textContent=setup?'Create your PIN':'Money Journal';$('ls').textContent=setup?'4–8 digits. Don\'t forget it: it can\'t be recovered.':'Locked. Enter your PIN.';
 $('pin2').classList.toggle('hide',!setup);$('go').textContent=setup?'Create PIN':'Unlock';$('fp').classList.toggle('hide',!(L.mj_cred&&L.mj_bk))}
$('go').onclick=async()=>{const p=$('pin').value,e=$('le');
 if(!L.mj_salt){if(!/^\d{4,8}$/.test(p))return e.textContent='Use 4–8 digits.';if(p!==$('pin2').value)return e.textContent='PINs do not match.';
  const s=crypto.getRandomValues(new Uint8Array(16));K=await derive(p,s);L.mj_salt=b64(s);L.mj_chk=await enc({ok:1});return start()}
 try{K=await derive(p,ub(L.mj_salt));await dec(L.mj_chk);start()}catch(x){K=null;e.textContent='Wrong PIN.'}};
$('pin').onkeydown=$('pin2').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('fp').onclick=async()=>{try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub(L.mj_cred)}],userVerification:'required',timeout:60000}});
 K=await crypto.subtle.importKey('raw',ub(L.mj_bk),'AES-GCM',true,['encrypt','decrypt']);await dec(L.mj_chk);start()}catch(x){K=null;$('le').textContent='Fingerprint failed. Use your PIN.'}};
async function bio(){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Money Journal'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'me',displayName:'Me'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 L.mj_cred=b64(c.rawId);L.mj_bk=b64(await crypto.subtle.exportKey('raw',K));alert('Fingerprint unlock enabled.')}catch(x){alert('Fingerprint is not available here. It needs the hosted https link and a phone with a fingerprint set up. Your PIN still works.')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&K)showLock()});
/* ---------- data ---------- */
const SPLIT={needs:60,wants:20,savings:20};
const PRE=[{n:'Starter 60/20/20',s:{needs:60,wants:20,savings:20},d:'Best for low income: needs are heavier, you still save 20% and keep 20% for a meaningful life.'},{n:'Classic 50/30/20',s:{needs:50,wants:30,savings:20},d:'Elizabeth Warren\'s rule. Use it when needs fall below half your income.'},{n:'Builder 50/15/35',s:{needs:50,wants:15,savings:35},d:'Aggressive wealth-building: pay yourself first.'}];
const SECS=[{k:'income',t:'💰 Paychecks',c:'--pri',d:'Paid every 2 weeks: usually 2 per month, 3 in some months'},{k:'needs',t:'🏠 Needs',c:'--need',d:'Rent, food, transport, bills, health'},{k:'wants',t:'🎈 Wants',c:'--want',d:'Joy within a limit, no guilt'},{k:'savings',t:'🌳 Savings & Goals',c:'--sav',d:'Emergency fund, dreams, debt payoff'},{k:'habits',t:'🔥 Money Habits',c:'--hab',d:'Discipline today, freedom tomorrow'}];
const QS=['Pay yourself first: move your savings before you spend anything.','A small amount saved every payday beats a big plan never started.','Integrity is spending like someone is watching, even when nobody is.','Track it, and it will start to obey you.','Your income will grow; your habits decide if it stays.','Skills are the best investment at 22. Keep learning.','Say no to one impulse today. Future you says thank you.','Emergency fund first, comfort second.','Discipline is a decision, not a feeling.','Compare yourself to who you were last month, not to others.','Do not lie to yourself about money. Write the real number.','Little income is a starting line, not a verdict.'];
const fresh=()=>({split:{...SPLIT},items:[{id:rid(),s:'income',n:'Paycheck 1',a:0,d:0,al:{}},{id:rid(),s:'income',n:'Paycheck 2',a:0,d:0,al:{}},
 ...['Rent / housing','Food & groceries','Transport','Airtime & data'].map(n=>({id:rid(),s:'needs',n,a:0,d:0})),{id:rid(),s:'wants',n:'Fun & treats',a:0,d:0},
 {id:rid(),s:'savings',n:'Emergency fund',a:0,d:0},{id:rid(),s:'savings',n:'My big goal',a:0,d:0},
 ...['Wrote down every expense','No impulse buys today','Paid myself first'].map(n=>({id:rid(),s:'habits',n,a:0,d:0}))]});
async function start(){$('lock').classList.add('hide');$('app').classList.remove('hide');await load()}
async function load(){S=null;try{S=await dec(L['mj_d_'+cur])}catch(e){S=fresh()}draw()}
function save(){clearTimeout(tm);tm=setTimeout(async()=>{if(K&&S)L['mj_d_'+cur]=await enc(S)},400)}
const sum=(s,f)=>S.items.filter(i=>i.s===s&&(!f||f(i))).reduce((a,i)=>a+(+i.a||0),0);
/* ---------- draw ---------- */
function draw(){if(!S)return;const inc=sum('income'),cp={needs:'--need',wants:'--want',savings:'--sav'},sp={};
 ['needs','wants','savings'].forEach(k=>sp[k]={plan:sum(k),cap:inc*S.split[k]/100});
 const spent=sum('needs',i=>i.d)+sum('wants',i=>i.d),saved=sum('savings',i=>i.d),left=inc-spent-saved,rate=inc?Math.round(saved/inc*100):0;
 const h=S.items.filter(i=>i.s==='habits'),hp=h.length?Math.round(h.filter(i=>i.d).length/h.length*100):0;
 const pb=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p)}%;background:var(${c})"></i></div>`;
 const card=k=>{const x=sp[k];return `<div><div class="k">${k}</div><div><b>${fmt(x.plan)}</b> <span class="t">/ ${fmt(x.cap)}</span></div>${pb(x.cap?x.plan/x.cap*100:0,cp[k])}<div class="t ${x.plan>x.cap?'over':''}">${x.cap?(x.plan>x.cap?'over by '+fmt(x.plan-x.cap):fmt(x.cap-x.plan)+' room'):'enter paychecks'}</div></div>`};
 const mn=new Date(cur+'-02').toLocaleString('en',{month:'long',year:'numeric'});
 const cur_=JSON.stringify(S.split);
 let H=`<div class="hd"><div class="w"><div class="mo"><button onclick="mv(-1)">‹</button><div style="text-align:center"><b>${mn}</b><div style="opacity:.85;font-size:13px">🌱 My Money Journal</div></div><button onclick="mv(1)">›</button></div></div></div><div class="main">
 <div class="card"><div class="k">Left to use this month</div><div class="big ${left<0?'over':''}">${fmt(left)}</div><div class="row sp t"><span>Income ${fmt(inc)}</span><span>Spent ${fmt(spent)}</span><span>Saved ${fmt(saved)}</span></div></div>
 <div class="card"><div class="grid">${card('needs')}${card('wants')}${card('savings')}<div><div class="k">Savings rate</div><div><b>${rate}%</b> <span class="t">habits ${hp}%</span></div>${pb(rate*4,'--gold')}<div class="t">goal ${S.split.savings}%+</div></div></div>
 <div class="row wr" style="margin-top:12px">${PRE.map((p,i)=>`<button class="${cur_===JSON.stringify(p.s)?'on':''}" onclick="pre(${i})">${p.n}</button>`).join('')}</div>
 <div class="t" style="margin-top:6px">${(PRE.find(p=>JSON.stringify(p.s)===cur_)||{d:'Custom split. Keep it adding to 100.'}).d}</div>
 <div class="row t" style="margin-top:6px">Custom %: ${['needs','wants','savings'].map(k=>`${k} <input type="number" style="width:42px" value="${S.split[k]}" onchange="S.split.${k}=+this.value;save();draw()">`).join(' ')}</div></div>`;
 const pays=S.items.filter(i=>i.s==='income'&&+i.a>0);
 if(pays.length){H+=`<div class="card"><h2>📅 Paycheck planner</h2><div class="t">When money lands, set each part aside straight away.</div>`;
  pays.forEach(p=>{H+=`<div style="margin-top:10px"><b>${esc(p.n)}</b> <span class="t">${fmt(p.a)}</span>`;
   [['savings','🌳 Save first','--sav'],['needs','🏠 Needs','--need'],['wants','🎈 Wants','--want']].forEach(([k,l,c])=>{H+=`<label class="al"><input type="checkbox" ${p.al&&p.al[k]?'checked':''} onchange="al('${p.id}','${k}',this.checked)"><span>${l}</span><b style="color:var(${c})">${fmt(p.a*S.split[k]/100)}</b></label>`});H+='</div>'});H+='</div>'}
 SECS.forEach(sec=>{const its=S.items.filter(i=>i.s===sec.k),hab=sec.k==='habits',bud=S.split[sec.k]!==undefined;
  H+=`<div class="card"><div class="row sp"><h2 style="color:var(${sec.c})">${sec.t}</h2><span class="pill" style="background:var(${sec.c})">${hab?its.filter(i=>i.d).length+'/'+its.length:fmt(sum(sec.k))}</span></div><div class="t">${sec.d}${bud?' · budget '+fmt(inc*S.split[sec.k]/100):''}</div>`;
  if(sec.k==='wants')H+=`<div class="t">Safe to spend on wants: <b>${fmt(inc-sum('needs')-sum('savings'))}</b></div>`;
  if(sec.k==='savings')H+=`<div class="t">Emergency fund goal: 3 months of needs = <b>${fmt(sum('needs')*3)}</b></div>`;
  its.forEach(i=>{H+=`<div class="it ${i.d?'done':''}"><input type="checkbox" ${i.d?'checked':''} onchange="up('${i.id}','d',this.checked?1:0)"><input class="nm" value="${esc(i.n)}" onchange="up('${i.id}','n',this.value,1)">${hab?'':`<input class="am" type="number" inputmode="decimal" placeholder="0" value="${i.a||''}" oninput="up('${i.id}','a',+this.value,1)" onchange="up('${i.id}','a',+this.value,1);setTimeout(draw,400)">`}<button class="x" onclick="del('${i.id}')">✕</button></div>`});
  H+=`<div class="row" style="margin-top:8px"><button class="p" onclick="add('${sec.k}')">+ Add</button>${['needs','wants','savings'].includes(sec.k)?`<button onclick="spread('${sec.k}')">Auto-fill to budget</button>`:''}</div></div>`});
 H+=`<div class="quote">“${QS[Math.floor(Date.now()/864e5)%QS.length]}”</div>
 <div class="card"><div class="row wr"><button onclick="bio()">👆 Enable fingerprint</button><button onclick="backup()">⬇ Backup</button><button onclick="$('imp').click()">⬆ Restore</button><button onclick="showLock()">🔒 Lock now</button></div><input id="imp" type="file" accept=".json" class="hide" onchange="restore(this)"><div class="t" style="margin-top:8px">Backup is encrypted with your PIN. Save it to Google Drive from your phone's share menu.</div></div></div>`;
 $('app').innerHTML=H}
function up(id,f,v,q){S.items.find(x=>x.id===id)[f]=v;save();if(!q)draw()}
function al(id,k,v){const p=S.items.find(x=>x.id===id);p.al=p.al||{};p.al[k]=v;save()}
function add(s){S.items.push({id:rid(),s,n:s==='income'?'Paycheck':'New item',a:0,d:0,al:{}});save();draw()}
function del(id){S.items=S.items.filter(i=>i.id!==id);save();draw()}
function pre(i){S.split={...PRE[i].s};save();draw()}
function spread(k){const its=S.items.filter(i=>i.s===k);if(!its.length)return;const c=sum('income')*S.split[k]/100;its.forEach(i=>i.a=Math.round(c/its.length));save();draw()}
function mv(n){const [y,m]=cur.split('-').map(Number);cur=ym(new Date(y,m-1+n,1));load()}
function backup(){const o={};for(const k in L)if(k.startsWith('mj_'))o[k]=L[k];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='money-journal-backup.json';a.click()}
function restore(el){const f=el.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!confirm('Replace data on this phone with the backup? Use the PIN the backup was made with.'))return;for(const k in o)if(k.startsWith('mj_')&&k!=='mj_cred'&&k!=='mj_bk')L[k]=o[k];location.reload()}).catch(()=>alert('Invalid file.'))}
showLock();
</script></body></html>
